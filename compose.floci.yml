services:
  floci:
    image: floci/floci@sha256:f5aa8c18302cedb4f2385f5c4e455b3efc77fee6bf7b6e5d1712b2817ba102db
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${FLOCI_PORT:-4567}:4566"
    environment:
      AWS_DEFAULT_REGION: ca-central-1
      FLOCI_DEFAULT_REGION: ca-central-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      platform.test-owner: aws-multi-vpc-platform
